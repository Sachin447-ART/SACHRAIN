name: Run EDITH

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Display repository files
        run: |
          echo "Checking repository contents..."
          pwd
          ls -la
          find . -maxdepth 3 -type f

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Python dependencies
        run: |
          python -m pip install SpeechRecognition ollama pyaudio

      - name: Verify EDITH file
        run: |
          if [ ! -f edith.py ]; then
            echo "ERROR: edith.py not found!"
            exit 1
          fi
          echo "EDITH Python file found successfully."

      - name: Run EDITH
        run: python -u edith.py
