
name: Run EDITH

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Display repository files
        run: |
          echo "Checking repository contents..."
          pwd
          ls -la
          find . -maxdepth 3 -type f

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            echo "No requirements.txt found."
            python -m pip install ollama
          fi

      - name: Verify EDITH file
        run: |
          if [ ! -f edith.py ]; then
            echo "ERROR: edith.py not found!"
            exit 1
          fi
          echo "EDITH Python file found successfully."

      - name: Run EDITH
        run: python -u edith.py
